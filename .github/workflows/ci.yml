name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 러너 커널의 주소 무작위화 비트가 크면 AddressSanitizer가 시작하지 못하는 경우가 있어 줄입니다.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      # make verify의 lint가 씁니다. 버전이 다르면 모양 판정이 달라지므로
      # CONVENTION.md의 설치 명령과 같은 버전을 씁니다.
      - run: pip install clang-format==21.1.8 clang-tidy==21.1.6
      - run: clang-format --version && clang-tidy --version
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: make verify
