<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mini-redis 구조</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <!-- 원본입니다. 그림을 바꾸면 이 파일을 고치고 같은 이름의 .png를 다시 만듭니다.
       색은 README 배너(mini-redis_README_banner.png)에 맞췄습니다:
       paper #f3f1ed, ink #232a3a, muted #4f5a6e, soft #5a6478, accent #b8322a, link #2e5aa8 -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f3f1ed;
      --color-ink:     #232a3a;
      --color-muted:   #4f5a6e;
      --color-accent:  #b8322a;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · mini-redis</p>
    <h1>mini-redis 구조</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mini-redis-architecture-title mini-redis-architecture-desc">
        <title id="mini-redis-architecture-title">mini-redis 구조</title>
        <desc id="mini-redis-architecture-desc">client의 HTTP 요청을 스레드 하나의 이벤트 루프가 받아 api 층과 store로 넘기고, 같은 루프가 주기 청소로 만료된 key를 지우며, store는 해시 테이블과 만료 min-heap을 함께 씁니다.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5a6e"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b8322a"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f3f1ed"/>

        <!-- Zone: 서버 프로세스 (스레드 하나) -->
        <rect x="300" y="144" width="820" height="504" rx="8" fill="rgba(35,42,58,0.02)" stroke="rgba(35,42,58,0.10)" stroke-width="0.8"/>
        <rect x="316" y="148" width="132" height="12" rx="2" fill="#f3f1ed"/>
        <text x="382" y="157" fill="#5a6478" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">1 PROCESS · 1 THREAD</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- client → 이벤트 루프 -->
        <line x1="640" y1="112" x2="640" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="648" y="122" width="32" height="12" rx="2" fill="#f3f1ed"/>
        <text x="664" y="131" fill="#5a6478" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

        <!-- 이벤트 루프 → api 층 -->
        <line x1="640" y1="256" x2="640" y2="296" stroke="#4f5a6e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="648" y="270" width="64" height="12" rx="2" fill="#f3f1ed"/>
        <text x="680" y="279" fill="#5a6478" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">API_HANDLE</text>

        <!-- api 층 → store -->
        <line x1="600" y1="360" x2="600" y2="420" stroke="#4f5a6e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="508" y="384" width="84" height="12" rx="2" fill="#f3f1ed"/>
        <text x="550" y="393" fill="#5a6478" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SET·GET·DELETE</text>

        <!-- 이벤트 루프 → 주기 청소 -->
        <line x1="780" y1="216" x2="880" y2="216" stroke="#4f5a6e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="798" y="198" width="64" height="12" rx="2" fill="#f3f1ed"/>
        <text x="830" y="207" fill="#5a6478" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">AFTER POLL</text>

        <!-- 주기 청소 → store -->
        <path d="M980,256 V384 Q980,392 972,392 H688 Q680,392 680,400 V420" fill="none" stroke="#4f5a6e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="988" y="314" width="84" height="12" rx="2" fill="#f3f1ed"/>
        <text x="1030" y="323" fill="#5a6478" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DELETE EXPIRED</text>

        <!-- store → 해시 테이블 -->
        <path d="M600,484 V514 Q600,522 592,522 H468 Q460,522 460,530 V560" fill="none" stroke="#4f5a6e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- store → 만료 heap -->
        <path d="M680,484 V514 Q680,522 688,522 H812 Q820,522 820,530 V560" fill="none" stroke="#4f5a6e" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Nodes -->
        <!-- client (external) -->
        <rect x="520" y="48" width="240" height="64" rx="6" fill="#f3f1ed"/>
        <rect x="520" y="48" width="240" height="64" rx="6" fill="rgba(35,42,58,0.03)" stroke="rgba(35,42,58,0.30)" stroke-width="1"/>
        <rect x="528" y="54" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,42,58,0.30)" stroke-width="0.8"/>
        <text x="540" y="63" fill="#5a6478" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="640" y="82" fill="#232a3a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">client</text>
        <text x="640" y="98" fill="#4f5a6e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">other server · curl · tests</text>

        <!-- 이벤트 루프 (focal) -->
        <rect x="500" y="176" width="280" height="80" rx="6" fill="#f3f1ed"/>
        <rect x="500" y="176" width="280" height="80" rx="6" fill="rgba(184,50,42,0.08)" stroke="#b8322a" stroke-width="1"/>
        <rect x="508" y="182" width="28" height="12" rx="2" fill="transparent" stroke="rgba(184,50,42,0.40)" stroke-width="0.8"/>
        <text x="522" y="191" fill="#b8322a" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
        <text x="640" y="214" fill="#232a3a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">이벤트 루프</text>
        <text x="640" y="230" fill="#4f5a6e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">server.c · mg_mgr_poll</text>
        <text x="640" y="244" fill="#4f5a6e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">128 conn · 10 s idle · 64 hdr · 16 MiB</text>

        <!-- 주기 청소 (focal) -->
        <rect x="880" y="176" width="200" height="80" rx="6" fill="#f3f1ed"/>
        <rect x="880" y="176" width="200" height="80" rx="6" fill="rgba(184,50,42,0.08)" stroke="#b8322a" stroke-width="1"/>
        <rect x="888" y="182" width="32" height="12" rx="2" fill="transparent" stroke="rgba(184,50,42,0.40)" stroke-width="0.8"/>
        <text x="904" y="191" fill="#b8322a" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TIMER</text>
        <text x="980" y="214" fill="#232a3a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">주기 청소</text>
        <text x="980" y="230" fill="#4f5a6e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sweep_run_if_due</text>
        <text x="980" y="244" fill="#4f5a6e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">every 25 ms · ≤ 2,000 keys</text>

        <!-- api 층 (backend) -->
        <rect x="520" y="296" width="240" height="64" rx="6" fill="#f3f1ed"/>
        <rect x="520" y="296" width="240" height="64" rx="6" fill="#ffffff" stroke="#232a3a" stroke-width="1"/>
        <rect x="528" y="302" width="24" height="12" rx="2" fill="transparent" stroke="rgba(35,42,58,0.40)" stroke-width="0.8"/>
        <text x="540" y="311" fill="#4f5a6e" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="640" y="330" fill="#232a3a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">api 층</text>
        <text x="640" y="346" fill="#4f5a6e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">api.c · status + body</text>

        <!-- store (backend) -->
        <rect x="520" y="420" width="240" height="64" rx="6" fill="#f3f1ed"/>
        <rect x="520" y="420" width="240" height="64" rx="6" fill="#ffffff" stroke="#232a3a" stroke-width="1"/>
        <rect x="528" y="426" width="32" height="12" rx="2" fill="transparent" stroke="rgba(35,42,58,0.40)" stroke-width="0.8"/>
        <text x="544" y="435" fill="#4f5a6e" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="640" y="454" fill="#232a3a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">store</text>
        <text x="640" y="470" fill="#4f5a6e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">store.c · entry = key + value</text>

        <!-- 해시 테이블 (store) -->
        <rect x="340" y="560" width="240" height="64" rx="6" fill="#f3f1ed"/>
        <rect x="340" y="560" width="240" height="64" rx="6" fill="rgba(35,42,58,0.05)" stroke="#4f5a6e" stroke-width="1"/>
        <rect x="348" y="566" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,90,110,0.40)" stroke-width="0.8"/>
        <text x="362" y="575" fill="#4f5a6e" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
        <text x="460" y="594" fill="#232a3a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">해시 테이블</text>
        <text x="460" y="610" fill="#4f5a6e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">hash.c · Pintos</text>

        <!-- 만료 heap (store) -->
        <rect x="700" y="560" width="240" height="64" rx="6" fill="#f3f1ed"/>
        <rect x="700" y="560" width="240" height="64" rx="6" fill="rgba(35,42,58,0.05)" stroke="#4f5a6e" stroke-width="1"/>
        <rect x="708" y="566" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,90,110,0.40)" stroke-width="0.8"/>
        <text x="722" y="575" fill="#4f5a6e" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
        <text x="820" y="594" fill="#232a3a" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">만료 heap</text>
        <text x="820" y="610" fill="#4f5a6e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">min-heap by expires_at</text>

        <!-- Legend -->
        <line x1="30" y1="668" x2="1250" y2="668" stroke="rgba(35,42,58,0.10)" stroke-width="0.8"/>
        <text x="30" y="696" fill="#4f5a6e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="684" width="16" height="12" rx="2" fill="rgba(184,50,42,0.08)" stroke="#b8322a" stroke-width="1"/>
        <text x="144" y="695" fill="#4f5a6e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">강조</text>
        <rect x="320" y="684" width="16" height="12" rx="2" fill="#ffffff" stroke="#232a3a" stroke-width="1"/>
        <text x="344" y="695" fill="#4f5a6e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">모듈</text>
        <rect x="420" y="684" width="16" height="12" rx="2" fill="rgba(35,42,58,0.05)" stroke="#4f5a6e" stroke-width="1"/>
        <text x="444" y="695" fill="#4f5a6e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">자료구조</text>
        <rect x="540" y="684" width="16" height="12" rx="2" fill="rgba(35,42,58,0.03)" stroke="rgba(35,42,58,0.30)" stroke-width="1"/>
        <text x="564" y="695" fill="#4f5a6e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">외부</text>
        <line x1="640" y1="690" x2="672" y2="690" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="684" y="695" fill="#4f5a6e" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">HTTP 요청</text>
      </svg>
    </div>
  </div>
</body>
</html>
